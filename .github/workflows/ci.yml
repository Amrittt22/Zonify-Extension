name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: extension — tests + build + packaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck + build
        run: npm run build

      - name: Verify the built extension
        run: npm run verify:dist

      - name: Upload the unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: zonify-extension
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  api:
    name: api — Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: api — Docker image + wire-level smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t zonify-backend:ci backend

      - name: Start it keyless (MOCK_LLM) and wait for /health
        run: |
          docker run -d --name zonify-ci -p 8787:8787 \
            -e MOCK_LLM=true \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            zonify-backend:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8787/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8787/health

      - name: An allowed origin gets an insight
        run: |
          code=$(curl -s -o /tmp/insight.json -w '%{http_code}' \
            -X POST http://localhost:8787/v1/insights \
            -H 'content-type: application/json' \
            -H 'origin: http://localhost:5173' \
            --data-binary @backend/sample.json)
          cat /tmp/insight.json
          test "$code" = "200"
          node -e "const r = require('/tmp/insight.json'); if (!r.insight?.headline) process.exit(1)"

      - name: Privacy — one extra field is rejected outright
        run: |
          node -e "const body = require('./backend/sample.json'); body.visitedUrl = 'https://secret.example'; require('fs').writeFileSync('/tmp/extra-field.json', JSON.stringify(body))"
          code=$(curl -s -o /tmp/extra.json -w '%{http_code}' \
            -X POST http://localhost:8787/v1/insights \
            -H 'content-type: application/json' \
            -H 'origin: http://localhost:5173' \
            --data-binary @/tmp/extra-field.json)
          cat /tmp/extra.json
          test "$code" = "400"
          grep -q INVALID_REQUEST /tmp/extra.json

      - name: Origin gate — an unlisted origin is rejected
        run: |
          code=$(curl -s -o /tmp/origin.json -w '%{http_code}' \
            -X POST http://localhost:8787/v1/insights \
            -H 'content-type: application/json' \
            -H 'origin: https://evil.example' \
            --data-binary @backend/sample.json)
          cat /tmp/origin.json
          test "$code" = "403"
          grep -q ORIGIN_NOT_ALLOWED /tmp/origin.json

      - name: Container logs
        if: always()
        run: docker logs zonify-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f zonify-ci || true
